<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XTC — Access Locked</title>
  <meta name="description" content="XTC Clothing — the next drop unlocks 1 October. Join the early access list for first access." />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="preload" as="video" href="images/water-bg.mp4" type="video/mp4" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      height: 100%;
      min-height: 100dvh;
      background: #111;
      overscroll-behavior: none;
    }
    body {
      height: 100%;
      min-height: 100dvh;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Background video, full-viewport (incl. behind iOS Safari's UI/safe areas). */
    .gate-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      background: #111;   /* fallback tone while the video loads/if it fails */
    }
    .gate {
      position: relative;
      z-index: 2;
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(64px + env(safe-area-inset-top)) 24px calc(64px + env(safe-area-inset-bottom));
      gap: 4px;
      animation: gate-fade 5s ease-in-out infinite;
    }
    @keyframes gate-fade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gate { animation: none; }
    }


    .gate__eyebrow {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #000;
      margin-bottom: 28px;
    }

    /* Countdown */
    .count {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(12px, 3vw, 32px);
      margin-bottom: 16px;
    }
    .count__unit { display: flex; flex-direction: column; align-items: center; }
    .count__num {
      font-family: 'SFMono-Regular', 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(24px, 5.5vw, 46px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 1px;
      color: #000;
      font-variant-numeric: tabular-nums;
      min-width: 1.9em;
    }
    .count__lbl {
      margin-top: 8px;
      font-size: 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.5);
    }
    .count__sep {
      font-family: 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(18px, 4.5vw, 34px);
      font-weight: 200;
      line-height: 1;
      color: rgba(0,0,0,0.5);
      align-self: center;
    }

    .gate__eyebrow .ord { font-size: 0.6em; text-transform: none; }

    /* Early access form — solid white input so it reads clearly against the video */
    .ea { width: 100%; max-width: 360px; margin-top: 36px; }
    .ea__row {
      display: flex;
      gap: 6px;
    }
    .ea__input {
      flex: 1;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.15);
      color: #000;
      font-family: inherit;
      font-size: 16px;   /* >=16px stops iOS Safari from zooming in on focus */
      letter-spacing: 0.5px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .ea__input::placeholder { color: rgba(0,0,0,0.4); }
    .ea__input:focus { border-color: rgba(0,0,0,0.6); background: #fff; }
    .ea__btn {
      background: #000;
      color: #fff;
      border: 1px solid #000;
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 18px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .ea__btn:hover { opacity: 0.8; }
    .ea__err {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: rgba(200,0,0,0.9);
      min-height: 14px;
    }

    /* Success state */
    .ea-done {
      display: none;
      width: 100%;
      max-width: 400px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .ea-done--show { display: flex; }
    .ea-done__tick {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .ea-done__title { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #000; }
    .ea-done__body { font-size: 11px; letter-spacing: 1px; color: rgba(0,0,0,0.6); text-align: center; }

    /* Remind me — quiet text link, no box */
    .remind {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      background: #000;
      color: #fff;
      border: 1px solid #000;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 13px 22px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .remind:hover { opacity: 0.8; }
    .remind svg { width: 13px; height: 13px; flex-shrink: 0; }

    @media (max-width: 480px) {
      .count { gap: 10px; }
      .gate { padding: 56px 20px 56px; }
      .ea__row { flex-direction: column; }
      .ea__btn { padding: 11px; }
    }
  </style>
</head>
<body>
  <video class="gate-bg" id="gateVideo" src="images/water-bg.mp4" autoplay loop muted playsinline preload="auto" aria-hidden="true"></video>

  <main class="gate">
    <p class="gate__eyebrow">War&trade; · 1<sup class="ord">st</sup> October · 6PM</p>

    <div class="count" id="count" role="timer" aria-live="off">
      <div class="count__unit"><span class="count__num" id="dd">00</span><span class="count__lbl">Days</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="hh">00</span><span class="count__lbl">Hrs</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="mm">00</span><span class="count__lbl">Min</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="ss">00</span><span class="count__lbl">Sec</span></div>
    </div>

    <a class="remind" href="/drop.ics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
      Set Calendar Reminder
    </a>

    <form class="ea" id="eaForm" novalidate>
      <div class="ea__row">
        <input class="ea__input" type="tel" id="eaPhone" placeholder="+44 7700 000000" autocomplete="tel" inputmode="tel" aria-label="Phone number" />
        <button class="ea__btn" type="submit">Join</button>
      </div>
      <p class="ea__err" id="eaErr"></p>
    </form>

    <div class="ea-done" id="eaDone" aria-live="polite">
      <div class="ea-done__tick">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="ea-done__title">You're In</p>
      <p class="ea-done__body">Watch your phone — early access is yours.</p>
    </div>


  </main>

  <script src="js/omnisend-config.js"></script>
  <script>

  // ── Background video: force playback in case autoplay is blocked ────────────
  (function () {
    var v = document.getElementById('gateVideo');
    if (!v) return;
    var tryPlay = function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
    tryPlay();
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) tryPlay();
    });
    // iOS Safari sometimes needs a user gesture even with muted+playsinline.
    document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
    document.addEventListener('click', tryPlay, { once: true });
  })();

  // ── Countdown to 01 October, 6PM (UK time, BST = UTC+1) ──────────────────────
  (function () {
    var TARGET = new Date('2026-10-01T18:00:00+01:00').getTime();  // 6PM UK, 1 Oct
    var dd = document.getElementById('dd'), hh = document.getElementById('hh'),
        mm = document.getElementById('mm'), ss = document.getElementById('ss');
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      var s = Math.max(0, Math.floor((TARGET - Date.now()) / 1000));
      dd.textContent = pad(Math.floor(s / 86400));
      hh.textContent = pad(Math.floor((s % 86400) / 3600));
      mm.textContent = pad(Math.floor((s % 3600) / 60));
      ss.textContent = pad(s % 60);
    }
    tick();
    setInterval(tick, 1000);
  })();

  // ── Early access form → Omnisend (via the server proxy) ──────────────────────
  (function () {
    var form = document.getElementById('eaForm');
    var input = document.getElementById('eaPhone');
    var err = document.getElementById('eaErr');
    var done = document.getElementById('eaDone');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      var raw = (input.value || '').trim();
      var digits = raw.replace(/\D/g, '');
      // No format requirement — just a sanity check that it's a plausible phone
      // number. Real numbers are 7–15 digits (E.164); this rejects obviously-fake
      // input, though only an SMS verification could prove the line is active.
      if (digits.length < 7 || digits.length > 15) {
        err.textContent = 'Please enter a valid phone number.';
        return;
      }
      // Send as typed; the server normalises to E.164 (UK-first for a leading 0).
      fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: raw, source: 'launch-early-access' })
      }).catch(function () {});
      if (window.omnisend) { try { omnisend.push(['identifyContact', { phone: raw }]); } catch (e2) {} }

      form.style.display = 'none';
      done.classList.add('ea-done--show');
    });
  })();

  </script>

  </body>
</html>
