<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XTC — Access Locked</title>
  <meta name="description" content="XTC Clothing — the next drop unlocks 1 October. Join the early access list for first access." />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Matrix rain canvas — full-screen background (black glyphs on white) */
    #mx {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }
    /* White vignette so the centred content stays readable over the rain */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.66) 45%, rgba(255,255,255,0.35) 100%);
      pointer-events: none;
    }

    .gate {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    /* Black logo on the white background (matches the rest of the site) */
    .gate__logo { height: 34px; width: auto; margin-bottom: 34px; filter: brightness(0); }

    .gate__eyebrow {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);
      margin-bottom: 18px;
    }
    .gate__title {
      font-size: clamp(30px, 7vw, 64px);
      font-weight: 200;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 34px;
      color: #000;
    }

    /* Countdown */
    .count {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(14px, 4vw, 40px);
      margin-bottom: 12px;
    }
    .count__unit { display: flex; flex-direction: column; align-items: center; }
    .count__num {
      font-family: 'SFMono-Regular', 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(34px, 9vw, 78px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: 2px;
      color: #000;
      text-shadow: 0 2px 22px rgba(0,0,0,0.14);
      font-variant-numeric: tabular-nums;
      min-width: 1.9em;
    }
    .count__lbl {
      margin-top: 12px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.45);
    }
    .count__sep {
      font-family: 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(28px, 8vw, 66px);
      line-height: 1;
      color: rgba(0,0,0,0.28);
      align-self: flex-start;
    }

    .gate__sub {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);
      margin-top: 26px;
      margin-bottom: 30px;
    }

    /* Early access form */
    .ea { width: 100%; max-width: 440px; }
    .ea__row { display: flex; gap: 8px; }
    .ea__input {
      flex: 1;
      background: rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.25);
      color: #000;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 15px 16px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .ea__input::placeholder { color: rgba(0,0,0,0.4); }
    .ea__input:focus { border-color: rgba(0,0,0,0.75); background: rgba(0,0,0,0.05); }
    .ea__btn {
      background: #000;
      color: #fff;
      border: 1px solid #000;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 0 26px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .ea__btn:hover { opacity: 0.85; }
    .ea__label {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.4);
    }
    .ea__err {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: rgba(200,0,0,0.85);
      min-height: 14px;
    }

    /* Success state */
    .ea-done {
      display: none;
      width: 100%;
      max-width: 440px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .ea-done--show { display: flex; }
    .ea-done__tick {
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
    }
    .ea-done__title { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; }
    .ea-done__body { font-size: 12px; letter-spacing: 1px; color: rgba(0,0,0,0.55); }

    @media (max-width: 480px) {
      .ea__row { flex-direction: column; }
      .ea__btn { padding: 14px; }
      .count { gap: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #mx { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <canvas id="mx"></canvas>
  <div class="veil"></div>

  <main class="gate">
    <img class="gate__logo" src="https://cdn.shopify.com/s/files/1/0968/4471/0227/files/whitelogo.png" alt="XTC"
         onerror="this.style.display='none'" />

    <p class="gate__eyebrow">SS26 · Access Locked</p>
    <h1 class="gate__title">Site Goes Live</h1>

    <div class="count" id="count" role="timer" aria-live="off">
      <div class="count__unit"><span class="count__num" id="dd">00</span><span class="count__lbl">Days</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="hh">00</span><span class="count__lbl">Hrs</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="mm">00</span><span class="count__lbl">Min</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="ss">00</span><span class="count__lbl">Sec</span></div>
    </div>

    <p class="gate__sub">Unlocks 01 October</p>

    <form class="ea" id="eaForm" novalidate>
      <div class="ea__row">
        <input class="ea__input" type="email" id="eaEmail" placeholder="your@email.com" autocomplete="email" aria-label="Email address" />
        <button class="ea__btn" type="submit">Join Early Access</button>
      </div>
      <p class="ea__label">Be first through the door — early access to the drop.</p>
      <p class="ea__err" id="eaErr"></p>
    </form>

    <div class="ea-done" id="eaDone" aria-live="polite">
      <div class="ea-done__tick">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="ea-done__title">You're In</p>
      <p class="ea-done__body">Watch your inbox — early access is yours.</p>
    </div>
  </main>

  <script src="js/omnisend-config.js"></script>
  <script>
  // ── Matrix rain (black glyphs on white) ──────────────────────────────────────
  (function () {
    var canvas = document.getElementById('mx');
    var ctx = canvas.getContext('2d');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var fontSize = 16, W, H, cols, drops, speeds;
    var CHARS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓ0123456789XTC';

    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(W / fontSize);
      drops = new Array(cols);
      speeds = new Array(cols);
      for (var i = 0; i < cols; i++) {
        drops[i] = Math.random() * -(H / fontSize);
        speeds[i] = 0.45 + Math.random() * 0.75;
      }
      ctx.font = fontSize + 'px monospace';
      ctx.textBaseline = 'top';
    }
    resize();
    window.addEventListener('resize', resize);

    function frame() {
      // White wash each frame = trails fade to white (theme-matched).
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';   // black rain
      for (var i = 0; i < cols; i++) {
        var ch = CHARS.charAt(Math.floor(Math.random() * CHARS.length));
        var y = drops[i] * fontSize;
        ctx.fillText(ch, i * fontSize, y);
        drops[i] += speeds[i];
        if (y > H && Math.random() > 0.975) {
          drops[i] = Math.random() * -20;
          speeds[i] = 0.45 + Math.random() * 0.75;
        }
      }
      requestAnimationFrame(frame);
    }
    if (reduce) {
      // One static pass so the page still has the effect without motion.
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      for (var i = 0; i < cols; i++) {
        for (var r = 0; r < H / fontSize; r += 2 + Math.floor(Math.random() * 4)) {
          ctx.fillText(CHARS.charAt(Math.floor(Math.random() * CHARS.length)), i * fontSize, r * fontSize);
        }
      }
    } else {
      frame();
    }
  })();

  // ── Countdown to 01 October (UK time, BST = UTC+1) ───────────────────────────
  (function () {
    var TARGET = new Date('2026-10-01T00:00:00+01:00').getTime();
    var els = { dd: document.getElementById('dd'), hh: document.getElementById('hh'),
                mm: document.getElementById('mm'), ss: document.getElementById('ss') };
    var prev = {};

    function pad(n) { return String(n).padStart(2, '0'); }

    // Brief "matrix" scramble whenever a field's value changes.
    function setField(el, val) {
      if (el._t) clearInterval(el._t);
      var frames = 5, i = 0;
      el._t = setInterval(function () {
        if (i >= frames) { el.textContent = val; clearInterval(el._t); el._t = null; return; }
        el.textContent = pad(Math.floor(Math.random() * 100));
        i++;
      }, 35);
    }

    function tick() {
      var diff = TARGET - Date.now();
      if (diff < 0) diff = 0;
      var s = Math.floor(diff / 1000);
      var v = {
        dd: Math.floor(s / 86400),
        hh: Math.floor((s % 86400) / 3600),
        mm: Math.floor((s % 3600) / 60),
        ss: s % 60
      };
      Object.keys(els).forEach(function (k) {
        var str = pad(v[k]);
        if (prev[k] !== str) { setField(els[k], str); prev[k] = str; }
      });
    }
    tick();
    setInterval(tick, 1000);
  })();

  // ── Early access form → Omnisend (via the server proxy) ──────────────────────
  (function () {
    var form = document.getElementById('eaForm');
    var input = document.getElementById('eaEmail');
    var err = document.getElementById('eaErr');
    var done = document.getElementById('eaDone');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (input.value || '').trim();
      err.textContent = '';
      if (!email || email.indexOf('@') < 1 || email.indexOf('.') < 0) {
        err.textContent = 'Please enter a valid email address.';
        return;
      }
      // omnisendSubscribe fires the Omnisend widget event AND posts to the
      // server proxy (/subscribe), which adds the contact with the secret key.
      if (typeof omnisendSubscribe === 'function') {
        omnisendSubscribe(email, 'launch-early-access');
      } else {
        fetch('/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, source: 'launch-early-access' })
        }).catch(function () {});
      }
      form.style.display = 'none';
      done.classList.add('ea-done--show');
    });
  })();
  </script>
</body>
</html>
