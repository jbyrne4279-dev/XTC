<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XTC — Access Locked</title>
  <meta name="description" content="XTC Clothing — the next drop unlocks 1 October. Join the early access list for first access." />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;               /* allow scroll so the preview cards are reachable */
      -webkit-font-smoothing: antialiased;
    }

    /* ASCII portrait effect — anchored to the bottom, behind the content/cards.
       Masked so it fades into the white page toward the top. */
    #mx {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 70vh;
      z-index: 0;                     /* behind .gate content (z-index 2), incl. product cards */
      pointer-events: auto;           /* enables mouse-reactive distortion */
      -webkit-mask-image: linear-gradient(to top, #000 0%, #000 30%, transparent 100%);
              mask-image: linear-gradient(to top, #000 0%, #000 30%, transparent 100%);
    }

    .gate {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 96px 20px 48px;   /* top clears the fixed nav */
    }

    /* Mockup nav bar — mirrors the main site header (logo left, action right) */
    .gate-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 64px);
      background: rgba(255,255,255,0.82);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .gate-nav__logo img { height: 26px; width: auto; display: block; filter: brightness(0); }
    .gate-nav__enter {
      border: 1px solid rgba(0,0,0,0.12);
      background: #ededed;            /* light grey box */
      color: #000;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 18px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .gate-nav__enter:hover { background: #e0e0e0; border-color: rgba(0,0,0,0.25); }

    /* Password entry modal */
    .pw-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.55);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .pw-modal[hidden] { display: none; }
    .pw-modal__box {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.15);
      box-shadow: 0 24px 60px rgba(0,0,0,0.18);
      width: 100%;
      max-width: 360px;
      margin: 20px;
      padding: 32px 26px 26px;
      position: relative;
      text-align: center;
    }
    .pw-modal__close {
      position: absolute; top: 8px; right: 12px;
      background: none; border: none; font-size: 24px; line-height: 1;
      color: rgba(0,0,0,0.5); cursor: pointer;
    }
    .pw-modal__title {
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(0,0,0,0.7); margin-bottom: 18px;
    }
    .pw-modal__input {
      width: 100%; box-sizing: border-box;
      background: rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.25);
      color: #000; font-family: inherit; font-size: 16px; letter-spacing: 1px;  /* >=16px: no iOS focus zoom */
      padding: 14px; outline: none; margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    .pw-modal__input:focus { border-color: rgba(0,0,0,0.75); }
    .pw-modal__btn {
      width: 100%; background: #000; color: #fff; border: 1px solid #000;
      font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 2.5px;
      text-transform: uppercase; padding: 14px; cursor: pointer; transition: opacity 0.2s;
    }
    .pw-modal__btn:hover { opacity: 0.85; }
    .pw-modal__err {
      margin-top: 10px; min-height: 14px;
      font-size: 11px; letter-spacing: 0.5px; color: rgba(200,0,0,0.85);
    }

    .gate__eyebrow {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);
      margin-bottom: 18px;
    }
    .gate__title {
      font-size: clamp(30px, 7vw, 64px);
      font-weight: 200;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 34px;
      color: #000;
    }

    /* Countdown */
    .count {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(14px, 4vw, 40px);
      margin-bottom: 12px;
    }
    .count__unit { display: flex; flex-direction: column; align-items: center; }
    .count__num {
      font-family: 'SFMono-Regular', 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(34px, 9vw, 78px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: 2px;
      color: #000;
      text-shadow: 0 2px 22px rgba(0,0,0,0.14);
      font-variant-numeric: tabular-nums;
      min-width: 1.9em;
    }
    .count__lbl {
      margin-top: 12px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.45);
    }
    .count__sep {
      font-family: 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(28px, 8vw, 66px);
      line-height: 1;
      color: rgba(0,0,0,0.28);
      align-self: flex-start;
    }

    .gate__sub {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);
      margin-top: 26px;
      margin-bottom: 30px;
    }
    .gate__sub .ord { font-size: 0.6em; text-transform: none; }   /* mini "st" ordinal */

    /* Early access form */
    .ea { width: 100%; max-width: 440px; }
    .ea__row { display: flex; gap: 8px; }
    .ea__input {
      flex: 1;
      background: rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.25);
      color: #000;
      font-family: inherit;
      font-size: 16px;   /* >=16px stops iOS from zooming in on focus */
      letter-spacing: 0.5px;
      padding: 15px 16px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .ea__input::placeholder { color: rgba(0,0,0,0.4); }
    .ea__input:focus { border-color: rgba(0,0,0,0.75); background: rgba(0,0,0,0.05); }
    .ea__btn {
      background: #000;
      color: #fff;
      border: 1px solid #000;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 0 26px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .ea__btn:hover { opacity: 0.85; }
    .ea__label {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.4);
    }
    .ea__err {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: rgba(200,0,0,0.85);
      min-height: 14px;
    }

    /* Success state */
    .ea-done {
      display: none;
      width: 100%;
      max-width: 440px;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      /* Solid card so the confirmation reads clearly over the matrix rain */
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.12);
      box-shadow: 0 20px 50px rgba(0,0,0,0.14);
      padding: 34px 28px;
      position: relative;
      z-index: 3;
    }
    .ea-done--show { display: flex; }
    .ea-done__tick {
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
    }
    .ea-done__title { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #000; }
    .ea-done__body { font-size: 12px; letter-spacing: 1px; color: rgba(0,0,0,0.6); text-align: center; }

    /* Remind me — adds a calendar event/alarm for the 1 Oct launch */
    .remind {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 18px;
      padding: 13px 24px;
      border: 1px solid rgba(0,0,0,0.4);
      background: rgba(255,255,255,0.6);
      color: #000;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .remind:hover { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.7); }
    .remind svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* War collection preview — non-interactive showcase cards (white theme) */
    .preview {
      margin-top: 48px;
      width: 100%;
      max-width: 720px;
      pointer-events: none;   /* previews only — not clickable */
    }
    .preview__label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.4);
      margin-top: 18px;
    }
    .preview__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .pv-card {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 12px 30px rgba(0,0,0,0.07);
      overflow: hidden;
      user-select: none;
      text-align: left;
    }
    .pv-card__media { aspect-ratio: 1/1; background: #f5f5f5; overflow: hidden; }
    .pv-card__media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pv-card__body { padding: 12px 12px 14px; }
    .pv-card__tag { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: rgba(0,0,0,0.4); }
    .pv-card__name { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin: 5px 0 3px; color: #000; }
    .pv-card__price { font-size: 12px; color: rgba(0,0,0,0.6); }

    @media (max-width: 480px) {
      .ea__row { flex-direction: column; }
      .ea__btn { padding: 14px; }
      .count { gap: 8px; }
      .pv-card__body { padding: 8px 8px 10px; }
      .pv-card__tag { font-size: 7px; }
      .pv-card__name { font-size: 10px; letter-spacing: 0.5px; }
      .pv-card__price { font-size: 10px; }
    }
  </style>
</head>
<body>
  <canvas id="mx"></canvas>

  <!-- Mockup nav bar: logo left, password-enter button right -->
  <nav class="gate-nav">
    <div class="gate-nav__logo">
      <img src="https://cdn.shopify.com/s/files/1/0968/4471/0227/files/whitelogo.png" alt="XTC" onerror="this.style.display='none'" />
    </div>
    <button class="gate-nav__enter" id="navEnter">Enter Password</button>
  </nav>

  <main class="gate">
    <p class="gate__eyebrow">SS26 · Access Locked</p>

    <div class="count" id="count" role="timer" aria-live="off">
      <div class="count__unit"><span class="count__num" id="dd">00</span><span class="count__lbl">Days</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="hh">00</span><span class="count__lbl">Hrs</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="mm">00</span><span class="count__lbl">Min</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="ss">00</span><span class="count__lbl">Sec</span></div>
    </div>

    <p class="gate__sub">Unlocks 1<sup class="ord">st</sup> October · 6PM</p>

    <form class="ea" id="eaForm" novalidate>
      <div class="ea__row">
        <input class="ea__input" type="tel" id="eaPhone" placeholder="+44 7700 000000" autocomplete="tel" inputmode="tel" aria-label="Phone number" />
        <button class="ea__btn" type="submit">Join Early Access</button>
      </div>
      <p class="ea__err" id="eaErr"></p>
    </form>

    <div class="ea-done" id="eaDone" aria-live="polite">
      <div class="ea-done__tick">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="ea-done__title">You're In</p>
      <p class="ea-done__body">Watch your phone — early access is yours.</p>
    </div>

    <a class="remind" href="/drop.ics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
      Set Calendar Reminder
    </a>

    <!-- War collection preview — non-interactive showcase cards -->
    <section class="preview" aria-hidden="true">
      <div class="preview__grid">
        <div class="pv-card">
          <div class="pv-card__media"><img src="images/ZIP-HOODIE-XTC-FRONT.png" alt="XTC War Zip Hoodie" loading="lazy" draggable="false" /></div>
          <div class="pv-card__body">
            <p class="pv-card__tag">Hoodie</p>
            <p class="pv-card__name">War™ Zip</p>
          </div>
        </div>
        <div class="pv-card">
          <div class="pv-card__media"><img src="images/JOGGERS-XTC.jpg" alt="XTC War Joggers" loading="lazy" draggable="false" /></div>
          <div class="pv-card__body">
            <p class="pv-card__tag">Joggers</p>
            <p class="pv-card__name">War™ Joggers</p>
          </div>
        </div>
        <div class="pv-card">
          <div class="pv-card__media"><img src="images/T-SHIRT-XTC.jpg" alt="XTC Uniform T-Shirt" loading="lazy" draggable="false" /></div>
          <div class="pv-card__body">
            <p class="pv-card__tag">T-Shirt</p>
            <p class="pv-card__name">Uniform T</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Password entry -->
  <div class="pw-modal" id="pwModal" hidden>
    <div class="pw-modal__box">
      <button class="pw-modal__close" id="pwClose" aria-label="Close">×</button>
      <p class="pw-modal__title">Enter Password</p>
      <form id="pwForm">
        <input class="pw-modal__input" type="password" id="pwInput" placeholder="Password" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="pw-modal__btn" type="submit">Enter</button>
      </form>
      <p class="pw-modal__err" id="pwErr"></p>
    </div>
  </div>

  <script src="js/omnisend-config.js"></script>
  <script>

  // ── ASCII portrait effect — image-driven glyphs, flow + mouse distortion ─────
  (function () {
    var canvas = document.getElementById('mx');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    var RAMP = ' .:-=+*#%@';
    var cellSize = 10;
    var flowSpeed = 0.22, flowStrength = 12;
    var mouseRadius = 150, mouseStrength = 22;
    var mouse = { x: -9999, y: -9999 };

    var W, H, cols, rows, brightness;
    var offscreen = document.createElement('canvas');
    var offCtx = offscreen.getContext('2d', { willReadFrequently: true });

    var img = new Image();
    img.src = 'images/gallery/campaign-girl-black-polo-78.jpeg';

    function sampleBrightness() {
      if (!offCtx || !cols || !rows || !img.complete || !img.naturalWidth) return;
      offscreen.width = cols;
      offscreen.height = rows;

      var imgRatio = img.naturalWidth / img.naturalHeight;
      var gridRatio = cols / rows;
      var sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
      if (imgRatio > gridRatio) {
        sw = img.naturalHeight * gridRatio;
        sx = (img.naturalWidth - sw) / 2;
      } else {
        sh = img.naturalWidth / gridRatio;
        sy = (img.naturalHeight - sh) / 2;
      }

      offCtx.clearRect(0, 0, cols, rows);
      offCtx.drawImage(img, sx, sy, sw, sh, 0, 0, cols, rows);
      var data = offCtx.getImageData(0, 0, cols, rows).data;
      var next = new Float32Array(cols * rows);
      for (var i = 0; i < cols * rows; i++) {
        var r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2], a = data[i * 4 + 3];
        next[i] = a === 0 ? 0 : (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      }
      brightness = next;
    }

    function resize() {
      W = window.innerWidth; H = Math.round(window.innerHeight * 0.7);
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.max(1, Math.floor(W / cellSize));
      rows = Math.max(1, Math.floor(H / cellSize));
      ctx.font = cellSize + 'px monospace';
      ctx.textBaseline = 'top';
      sampleBrightness();
    }
    img.onload = resize;
    resize();
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointermove', function (e) {
      var rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('pointerleave', function () {
      mouse.x = -9999; mouse.y = -9999;
    });

    function drawFrame(t) {
      ctx.clearRect(0, 0, W, H);
      if (!brightness) return;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';

      for (var row = 0; row < rows; row++) {
        for (var col = 0; col < cols; col++) {
          var idx = row * cols + col;
          var value = brightness[idx];
          if (value <= 0) continue;

          var px = col * cellSize, py = row * cellSize;
          var angle = Math.sin(col * 0.15 + t * flowSpeed) * Math.cos(row * 0.15 - t * flowSpeed) * Math.PI * 2;
          px += Math.cos(angle) * flowStrength;
          py += Math.sin(angle) * flowStrength;

          var dx = px - mouse.x, dy = py - mouse.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < mouseRadius) {
            var force = (1 - dist / mouseRadius) * mouseStrength;
            var nx = dist === 0 ? 0 : dx / dist, ny = dist === 0 ? 0 : dy / dist;
            px += nx * force;
            py += ny * force;
            value = Math.min(1, value + (1 - dist / mouseRadius) * 0.4);
          }

          var charIndex = Math.min(RAMP.length - 1, Math.floor(value * (RAMP.length - 1)));
          var ch = RAMP.charAt(charIndex);
          if (ch === ' ') continue;
          ctx.fillText(ch, px, py);
        }
      }
    }

    if (reduce) {
      drawFrame(0);
    } else {
      (function frame(now) {
        drawFrame(now / 1000);
        requestAnimationFrame(frame);
      })(0);
    }
  })();

  // ── Countdown to 01 October, 6PM (UK time, BST = UTC+1) ──────────────────────
  (function () {
    var TARGET = new Date('2026-10-01T18:00:00+01:00').getTime();  // 6PM UK, 1 Oct
    var dd = document.getElementById('dd'), hh = document.getElementById('hh'),
        mm = document.getElementById('mm'), ss = document.getElementById('ss');
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      var s = Math.max(0, Math.floor((TARGET - Date.now()) / 1000));
      dd.textContent = pad(Math.floor(s / 86400));
      hh.textContent = pad(Math.floor((s % 86400) / 3600));
      mm.textContent = pad(Math.floor((s % 3600) / 60));
      ss.textContent = pad(s % 60);
    }
    tick();
    setInterval(tick, 1000);
  })();

  // ── Early access form → Omnisend (via the server proxy) ──────────────────────
  (function () {
    var form = document.getElementById('eaForm');
    var input = document.getElementById('eaPhone');
    var err = document.getElementById('eaErr');
    var done = document.getElementById('eaDone');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      var raw = (input.value || '').trim();
      var digits = raw.replace(/\D/g, '');
      // No format requirement — just a sanity check that it's a plausible phone
      // number. Real numbers are 7–15 digits (E.164); this rejects obviously-fake
      // input, though only an SMS verification could prove the line is active.
      if (digits.length < 7 || digits.length > 15) {
        err.textContent = 'Please enter a valid phone number.';
        return;
      }
      // Send as typed; the server normalises to E.164 (UK-first for a leading 0).
      fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: raw, source: 'launch-early-access' })
      }).catch(function () {});
      if (window.omnisend) { try { omnisend.push(['identifyContact', { phone: raw }]); } catch (e2) {} }

      form.style.display = 'none';
      done.classList.add('ea-done--show');
    });
  })();

  // ── Password enter (nav button) ──────────────────────────────────────────────
  (function () {
    // NOTE: this is a client-side check only — fine for a launch-gate mock, but
    // NOT real security (anyone can read the password in the page source). For a
    // true gate, verify the password server-side and set a cookie.
    var PASSWORD = 'xtc2026';
    var openBtn = document.getElementById('navEnter');
    var modal = document.getElementById('pwModal');
    var closeBtn = document.getElementById('pwClose');
    var form = document.getElementById('pwForm');
    var input = document.getElementById('pwInput');
    var err = document.getElementById('pwErr');

    function open() { modal.hidden = false; setTimeout(function () { input.focus(); }, 30); }
    function close() { modal.hidden = true; err.textContent = ''; input.value = ''; }
