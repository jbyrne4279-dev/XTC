<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XTC — Access Locked</title>
  <meta name="description" content="XTC Clothing — the next drop unlocks 1 October. Join the early access list for first access." />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="preload" as="video" href="images/water-bg.mp4" type="video/mp4" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      height: 100%;
      min-height: 100dvh;
      background: #111;
      overscroll-behavior: none;
    }
    body {
      height: 100%;
      min-height: 100dvh;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Background video, full-viewport (incl. behind iOS Safari's UI/safe areas). */
    .gate-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      background: #111;   /* fallback tone while the video loads/if it fails */
    }
    .gate {
      position: relative;
      z-index: 2;
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(64px + env(safe-area-inset-top)) 24px calc(64px + env(safe-area-inset-bottom));
      gap: 4px;
      animation: gate-fade 5s ease-in-out infinite;
    }
    @keyframes gate-fade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    /* Stop the fade while the user is filling in the phone field */
    .gate--typing { animation: none; opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .gate { animation: none; }
    }

    /* After sign-up: hide everything except the success state, centered. */
    .gate--success {
      animation: none;
      padding: 24px;
    }
    .gate--success .gate__emblem,
    .gate--success .gate__eyebrow,
    .gate--success .count,
    .gate--success .remind,
    .gate--success .ea {
      display: none;
    }

    /* 4s after success: swap back to the timer + reminder button (email form
       stays gone — they've already joined). */
    .gate--joined .ea {
      display: none;
    }


    .gate__eyebrow {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #000;
      margin-top: 20px;
      margin-bottom: 0;
    }

    /* Countdown */
    .count {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(12px, 3vw, 32px);
      margin-bottom: 16px;
    }
    .count__unit { display: flex; flex-direction: column; align-items: center; }
    .count__num {
      font-family: 'SFMono-Regular', 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(24px, 5.5vw, 46px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 1px;
      color: #000;
      font-variant-numeric: tabular-nums;
      min-width: 1.9em;
    }
    .count__lbl {
      margin-top: 8px;
      font-size: 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.5);
    }
    .count__sep {
      font-family: 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(18px, 4.5vw, 34px);
      font-weight: 200;
      line-height: 1;
      color: rgba(0,0,0,0.5);
      align-self: center;
    }

    .gate__eyebrow .ord { font-size: 0.6em; text-transform: none; }

    .gate__emblem {
      width: 38px;
      height: auto;
      flex-shrink: 0;
      opacity: 1;
      filter: brightness(0) drop-shadow(0 1px 4px rgba(0,0,0,0.25));
    }

    /* Early access form — solid white input so it reads clearly against the video */
    .ea { width: 100%; max-width: 460px; margin-top: 36px; }
    .ea__row {
      display: flex;
      gap: 6px;
    }
    .ea__field {
      flex: 1;
      display: flex;
      align-items: stretch;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.15);
      transition: border-color 0.2s, background 0.2s;
    }
    .ea__icon-box {
      width: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(0,0,0,0.15);
    }
    .ea__field:focus-within { border-color: rgba(0,0,0,0.6); background: #fff; }
    .ea__input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: #000;
      font-family: inherit;
      font-size: 16px;   /* >=16px stops iOS Safari from zooming in on focus */
      letter-spacing: 0.5px;
      padding: 11px 12px;
      outline: none;
    }
    .ea__input::placeholder { color: rgba(0,0,0,0.4); }
    .ea__btn {
      background: #000;
      color: #fff;
      border: 1px solid #000;
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 18px;
      cursor: pointer;
      transition: opacity 0.2s, background 0.25s, border-color 0.25s;
      white-space: nowrap;
    }
    .ea__btn:hover { opacity: 0.8; }
    .ea__err {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: rgba(200,0,0,0.9);
      min-height: 14px;
    }

    /* Success state */
    .ea-done {
      display: none;
      width: 100%;
      max-width: 400px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .ea-done--show { opacity: 1; transform: scale(1); }
    .ea-done__tick {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .ea-done__title { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #000; }
    .ea-done__body { font-size: 11px; letter-spacing: 1px; color: rgba(0,0,0,0.6); text-align: center; }

    /* Remind me — quiet text link, no box. Desktop hides it; mobile shows it
       (see the @media block below) since desktop users have the countdown
       and eyebrow date/time visible without needing a calendar nudge. Kept
       as a plain underline-free text link (not a solid button) so it stays
       out of the way on small screens. */
    .remind {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      color: rgba(0,0,0,0.5);
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .remind:hover { color: rgba(0,0,0,0.8); }
    .remind svg { width: 12px; height: 12px; flex-shrink: 0; }

    /* Buttons flash green (valid) or red (invalid) as the user types, then
       settle back to black. */
    .flash-green .ea__btn { background: #16a34a; border-color: #16a34a; }
    .flash-red .ea__btn { background: #dc2626; border-color: #dc2626; }

    /* Draws the eye to the reminder link so it isn't missed as quiet text. */
    @keyframes remind-flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @media (max-width: 480px) {
      .gate { padding: 48px 20px 48px; gap: 2px; }
      .count { gap: 8px; margin-bottom: 10px; }
      .gate__eyebrow { margin-top: 12px; margin-bottom: 0; }
      .ea { margin-top: 24px; }
      .remind { display: inline-flex; animation: remind-flash 1.8s ease-in-out infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      .remind { animation: none; }
    }
  </style>
</head>
<body>
  <video class="gate-bg" id="gateVideo" src="images/water-bg.mp4" autoplay loop muted playsinline preload="auto" aria-hidden="true"></video>

  <main class="gate">
    <div class="count" id="count" role="timer" aria-live="off">
      <div class="count__unit"><span class="count__num" id="dd">00</span><span class="count__lbl">Days</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="hh">00</span><span class="count__lbl">Hrs</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="mm">00</span><span class="count__lbl">Min</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="ss">00</span><span class="count__lbl">Sec</span></div>
    </div>

    <p class="gate__eyebrow">War&trade; · 1<sup class="ord">st</sup> October · 6PM</p>

    <form class="ea" id="eaForm" novalidate>
      <div class="ea__row">
        <div class="ea__field">
          <div class="ea__icon-box"><img class="gate__emblem" src="images/skull-emblem-icon.webp?v=1787779103" alt="XTC skull emblem" /></div>
          <input class="ea__input" type="tel" id="eaPhone" placeholder="07762 326 426" autocomplete="tel" inputmode="tel" aria-label="Phone number" />
        </div>
        <button class="ea__btn" type="submit">Join</button>
      </div>
      <p class="ea__err" id="eaErr"></p>
      <a class="remind" href="/drop.ics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
        Set Calendar Reminder
      </a>
    </form>

    <div class="ea-done" id="eaDone" aria-live="polite">
      <div class="ea-done__tick">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="ea-done__title">You're In</p>
      <p class="ea-done__body">Watch your phone — early access is yours.</p>
    </div>


  </main>

  <script src="js/omnisend-config.js"></script>
  <script>

  // ── Background video: force playback in case autoplay is blocked ────────────
  (function () {
    var v = document.getElementById('gateVideo');
    if (!v) return;
    var tryPlay = function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
    tryPlay();
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) tryPlay();
    });
    // iOS Safari sometimes needs a user gesture even with muted+playsinline.
    document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
    document.addEventListener('click', tryPlay, { once: true });

    // Mobile Safari/Chrome occasionally stalls the video mid-loop (buffering
    // hiccup, background-tab throttling, memory pressure) and never recovers
    // on its own. Watch for the currentTime not advancing and nudge it back
    // into life; if that keeps failing, hard-reload the source as a last resort.
    var lastTime = -1, stuckTicks = 0, reloadAttempts = 0;
    setInterval(function () {
      if (document.hidden) return;
      if (v.paused || v.ended) { tryPlay(); return; }
      if (v.currentTime === lastTime) {
        stuckTicks++;
        if (stuckTicks === 2) {
          tryPlay();
        } else if (stuckTicks >= 4 && reloadAttempts < 3) {
          reloadAttempts++;
          stuckTicks = 0;
          var t = v.currentTime;
          v.load();
          v.currentTime = t;
          tryPlay();
        }
      } else {
        stuckTicks = 0;
      }
      lastTime = v.currentTime;
    }, 2000);
  })();

  // ── Countdown to 01 October, 6PM (UK time, BST = UTC+1) ──────────────────────
  (function () {
    var TARGET = new Date('2026-10-01T18:00:00+01:00').getTime();  // 6PM UK, 1 Oct
    var dd = document.getElementById('dd'), hh = document.getElementById('hh'),
        mm = document.getElementById('mm'), ss = document.getElementById('ss');
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      var s = Math.max(0, Math.floor((TARGET - Date.now()) / 1000));
      dd.textContent = pad(Math.floor(s / 86400));
      hh.textContent = pad(Math.floor((s % 86400) / 3600));
      mm.textContent = pad(Math.floor((s % 3600) / 60));
      ss.textContent = pad(s % 60);
    }
    tick();
    setInterval(tick, 1000);
  })();

  // ── Early access form → Omnisend (via the server proxy) ──────────────────────
  (function () {
    if (typeof initPhoneCountrySelectors === 'function') initPhoneCountrySelectors();

    var gate = document.querySelector('.gate');
    var form = document.getElementById('eaForm');
    var input = document.getElementById('eaPhone');
    var err = document.getElementById('eaErr');
    var done = document.getElementById('eaDone');

    // Stop the page fade while the phone field is focused.
    input.addEventListener('focus', function () { gate.classList.add('gate--typing'); });
    input.addEventListener('blur', function () { gate.classList.remove('gate--typing'); });

    // Buttons turn green as soon as a number is entered.
    // Flash the buttons green (valid) or red (invalid) a moment after the
    // user stops typing, then settle back to black.
    var flashTimer, clearTimer;
    input.addEventListener('input', function () {
      clearTimeout(flashTimer);
      clearTimeout(clearTimer);
      gate.classList.remove('flash-green', 'flash-red');

      var digits = input.value.replace(/\D/g, '');
      if (!digits.length) return; // empty — stay black, no flash

      flashTimer = setTimeout(function () {
        var valid = digits.length >= 7 && digits.length <= 15;
        gate.classList.add(valid ? 'flash-green' : 'flash-red');
        clearTimer = setTimeout(function () {
          gate.classList.remove('flash-green', 'flash-red');
        }, 700);
      }, 350);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      var raw = (input.value || '').trim();
      var digits = raw.replace(/\D/g, '');
      // No format requirement — just a sanity check that it's a plausible phone
      // number. Real numbers are 7–15 digits (E.164); this rejects obviously-fake
      // input, though only an SMS verification could prove the line is active.
      if (digits.length < 7 || digits.length > 15) {
        err.textContent = 'Please enter a valid phone number.';
        return;
      }
      // Send as typed; the server normalises to E.164 (UK-first for a leading 0).
      fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: raw, source: 'launch-early-access' })
      }).catch(function () {});
      if (window.omnisend) { try { omnisend.push(['identifyContact', { phone: raw }]); } catch (e2) {} }

      // Strip the page down to just the success state, centered.
      gate.classList.add('gate--success');
      done.style.display = 'flex';
      done.offsetHeight; // force reflow so the fade/scale-in actually transitions
      done.classList.add('ea-done--show');

      // After 4s, fade the success state back out and swap in the timer +
      // reminder button (the email form stays hidden — they've already joined).
      setTimeout(function () {
        done.classList.remove('ea-done--show');
        gate.classList.remove('gate--success');
        gate.classList.add('gate--joined');
        setTimeout(function () { done.style.display = 'none'; }, 500);
      }, 4000);
    });
  })();

  </script>
