<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XTC — Access Locked</title>
  <meta name="description" content="XTC Clothing — the next drop unlocks 1 October. Join the early access list for first access." />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="preload" as="video" href="images/water-bg.mp4" type="video/mp4" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; min-height: 100dvh; background: #111; }
    body {
      height: 100%;
      min-height: 100dvh;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    /* Background video, full-viewport (incl. behind iOS Safari's UI/safe areas).
       A light top/bottom gradient (not a full dark wash) keeps the footage bright
       while still giving the nav and bottom content enough contrast to read. */
    .gate-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      background: #111;   /* fallback tone while the video loads/if it fails */
    }
    .gate-scrim {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.4) 30%, rgba(0,0,0,0.45) 70%, rgba(0,0,0,0.6) 100%);
    }

    .gate {
      position: relative;
      z-index: 2;
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px calc(64px + env(safe-area-inset-bottom));
      gap: 4px;
    }

    /* Minimal transparent nav — logo left, subtle text link right */
    .gate-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      height: calc(88px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top) clamp(24px, 5vw, 64px) 0;
    }
    .gate-nav__logo img { height: 22px; width: auto; display: block; }
    .gate-nav__enter {
      border: none;
      background: none;
      color: rgba(255,255,255,0.8);
      font-family: inherit;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 8px 2px;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 2px 12px rgba(0,0,0,0.6);
      transition: color 0.2s, border-color 0.2s;
    }
    .gate-nav__enter:hover { color: #fff; border-color: rgba(255,255,255,0.6); }

    /* Password entry modal — dark glass */
    .pw-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .pw-modal[hidden] { display: none; }
    .pw-modal__box {
      background: rgba(20,20,20,0.75);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 360px;
      margin: 20px;
      padding: 40px 30px 30px;
      position: relative;
      text-align: center;
    }
    .pw-modal__close {
      position: absolute; top: 10px; right: 14px;
      background: none; border: none; font-size: 22px; line-height: 1;
      color: rgba(255,255,255,0.45); cursor: pointer;
    }
    .pw-modal__close:hover { color: rgba(255,255,255,0.8); }
    .pw-modal__title {
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.55); margin-bottom: 22px;
    }
    .pw-modal__input {
      width: 100%; box-sizing: border-box;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.25);
      color: #fff; font-family: inherit; font-size: 16px; letter-spacing: 1px;
      text-align: center;
      padding: 10px 4px; outline: none; margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .pw-modal__input::placeholder { color: rgba(255,255,255,0.35); }
    .pw-modal__input:focus { border-color: rgba(255,255,255,0.8); }
    .pw-modal__btn {
      width: 100%; background: #fff; color: #000; border: 1px solid #fff;
      font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: 3px;
      text-transform: uppercase; padding: 14px; cursor: pointer; transition: opacity 0.2s;
    }
    .pw-modal__btn:hover { opacity: 0.85; }
    .pw-modal__err {
      margin-top: 12px; min-height: 14px;
      font-size: 10px; letter-spacing: 0.5px; color: rgba(255,120,120,0.9);
    }

    .gate__eyebrow {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 2px 14px rgba(0,0,0,0.6);
      margin-bottom: 28px;
    }

    /* Countdown */
    .count {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(16px, 4vw, 44px);
      margin-bottom: 20px;
    }
    .count__unit { display: flex; flex-direction: column; align-items: center; }
    .count__num {
      font-family: 'SFMono-Regular', 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(32px, 8vw, 68px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 3px 20px rgba(0,0,0,0.6);
      font-variant-numeric: tabular-nums;
      min-width: 1.9em;
    }
    .count__lbl {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 2px 12px rgba(0,0,0,0.6);
    }
    .count__sep {
      font-family: 'Menlo', 'Consolas', ui-monospace, monospace;
      font-size: clamp(24px, 7vw, 52px);
      font-weight: 200;
      line-height: 1;
      color: rgba(255,255,255,0.4);
      align-self: flex-start;
    }

    .gate__sub {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 2px 12px rgba(0,0,0,0.6);
      margin-bottom: 44px;
    }
    .gate__sub .ord { font-size: 0.6em; text-transform: none; }

    /* Early access form — bordered, glassy input so it reads clearly against the video */
    .ea { width: 100%; max-width: 400px; }
    .ea__row {
      display: flex;
      gap: 8px;
    }
    .ea__input {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.4);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.5px;
      padding: 15px 16px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .ea__input::placeholder { color: rgba(255,255,255,0.55); }
    .ea__input:focus { border-color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.4); }
    .ea__btn {
      background: #fff;
      color: #000;
      border: 1px solid #fff;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 0 22px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .ea__btn:hover { opacity: 0.8; }
    .ea__err {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: rgba(255,120,120,0.9);
      min-height: 14px;
    }

    /* Success state */
    .ea-done {
      display: none;
      width: 100%;
      max-width: 400px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .ea-done--show { display: flex; }
    .ea-done__tick {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .ea-done__title { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #fff; }
    .ea-done__body { font-size: 11px; letter-spacing: 1px; color: rgba(255,255,255,0.65); text-align: center; }

    /* Remind me — quiet text link, no box */
    .remind {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 36px;
      color: rgba(255,255,255,0.65);
      font-family: inherit;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 2px 12px rgba(0,0,0,0.6);
      transition: color 0.2s;
    }
    .remind:hover { color: #fff; }
    .remind svg { width: 13px; height: 13px; flex-shrink: 0; }

    @media (max-width: 480px) {
      .count { gap: 10px; }
      .gate { padding: 100px 20px 56px; }
      .ea__row { flex-direction: column; }
      .ea__btn { padding: 14px; }
    }
  </style>
</head>
<body>
  <video class="gate-bg" id="gateVideo" src="images/water-bg.mp4" autoplay loop muted playsinline preload="auto" aria-hidden="true"></video>
  <div class="gate-scrim" aria-hidden="true"></div>

  <!-- Minimal nav: logo left, password-enter link right -->
  <nav class="gate-nav">
    <div class="gate-nav__logo">
      <img src="https://cdn.shopify.com/s/files/1/0968/4471/0227/files/whitelogo.png" alt="XTC" onerror="this.style.display='none'" />
    </div>
    <button class="gate-nav__enter" id="navEnter">Enter Password</button>
  </nav>

  <main class="gate">
    <p class="gate__eyebrow">War&trade; · Coming Soon</p>

    <div class="count" id="count" role="timer" aria-live="off">
      <div class="count__unit"><span class="count__num" id="dd">00</span><span class="count__lbl">Days</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="hh">00</span><span class="count__lbl">Hrs</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="mm">00</span><span class="count__lbl">Min</span></div>
      <span class="count__sep">:</span>
      <div class="count__unit"><span class="count__num" id="ss">00</span><span class="count__lbl">Sec</span></div>
    </div>

    <p class="gate__sub">Unlocks 1<sup class="ord">st</sup> October · 6PM</p>

    <form class="ea" id="eaForm" novalidate>
      <div class="ea__row">
        <input class="ea__input" type="tel" id="eaPhone" placeholder="+44 7700 000000" autocomplete="tel" inputmode="tel" aria-label="Phone number" />
        <button class="ea__btn" type="submit">Join</button>
      </div>
      <p class="ea__err" id="eaErr"></p>
    </form>

    <div class="ea-done" id="eaDone" aria-live="polite">
      <div class="ea-done__tick">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="ea-done__title">You're In</p>
      <p class="ea-done__body">Watch your phone — early access is yours.</p>
    </div>

    <a class="remind" href="/drop.ics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
      Set Calendar Reminder
    </a>
  </main>

  <!-- Password entry -->
  <div class="pw-modal" id="pwModal" hidden>
    <div class="pw-modal__box">
      <button class="pw-modal__close" id="pwClose" aria-label="Close">×</button>
      <p class="pw-modal__title">Enter Password</p>
      <form id="pwForm">
        <input class="pw-modal__input" type="password" id="pwInput" placeholder="Password" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="pw-modal__btn" type="submit">Enter</button>
      </form>
      <p class="pw-modal__err" id="pwErr"></p>
    </div>
  </div>

  <script src="js/omnisend-config.js"></script>
  <script>

  // ── Background video: force playback in case autoplay is blocked ────────────
  (function () {
    var v = document.getElementById('gateVideo');
    if (!v) return;
    var tryPlay = function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
    tryPlay();
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) tryPlay();
    });
    // iOS Safari sometimes needs a user gesture even with muted+playsinline.
    document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
    document.addEventListener('click', tryPlay, { once: true });
  })();

  // ── Countdown to 01 October, 6PM (UK time, BST = UTC+1) ──────────────────────
  (function () {
    var TARGET = new Date('2026-10-01T18:00:00+01:00').getTime();  // 6PM UK, 1 Oct
    var dd = document.getElementById('dd'), hh = document.getElementById('hh'),
        mm = document.getElementById('mm'), ss = document.getElementById('ss');
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      var s = Math.max(0, Math.floor((TARGET - Date.now()) / 1000));
      dd.textContent = pad(Math.floor(s / 86400));
      hh.textContent = pad(Math.floor((s % 86400) / 3600));
      mm.textContent = pad(Math.floor((s % 3600) / 60));
      ss.textContent = pad(s % 60);
    }
    tick();
    setInterval(tick, 1000);
  })();

  // ── Early access form → Omnisend (via the server proxy) ──────────────────────
  (function () {
    var form = document.getElementById('eaForm');
    var input = document.getElementById('eaPhone');
    var err = document.getElementById('eaErr');
    var done = document.getElementById('eaDone');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      var raw = (input.value || '').trim();
      var digits = raw.replace(/\D/g, '');
      // No format requirement — just a sanity check that it's a plausible phone
      // number. Real numbers are 7–15 digits (E.164); this rejects obviously-fake
      // input, though only an SMS verification could prove the line is active.
      if (digits.length < 7 || digits.length > 15) {
        err.textContent = 'Please enter a valid phone number.';
        return;
      }
      // Send as typed; the server normalises to E.164 (UK-first for a leading 0).
      fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: raw, source: 'launch-early-access' })
      }).catch(function () {});
      if (window.omnisend) { try { omnisend.push(['identifyContact', { phone: raw }]); } catch (e2) {} }

      form.style.display = 'none';
      done.classList.add('ea-done--show');
    });
  })();

  // ── Password enter (nav button) ──────────────────────────────────────────────
  (function () {
    // NOTE: this is a client-side check only — fine for a launch-gate mock, but
    // NOT real security (anyone can read the password in the page source). For a
    // true gate, verify the password server-side and set a cookie.
    var PASSWORD = 'xtc2026';
    var openBtn = document.getElementById('navEnter');
    var modal = document.getElementById('pwModal');
    var closeBtn = document.getElementById('pwClose');
    var form = document.getElementById('pwForm');
    var input = document.getElementById('pwInput');
    var err = document.getElementById('pwErr');

    function open() { modal.hidden = false; setTimeout(function () { input.focus(); }, 30); }
    function close() { modal.hidden = true; err.textContent = ''; input.value = ''; }

    openBtn.addEventListener('click', open);
    closeBtn.addEventListener('click', close);
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) close(); });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if ((input.value || '') === PASSWORD) { window.location.href = '/'; }
      else { err.textContent = 'Incorrect password.'; input.select(); }
    });
  })();
  </script>

</script>
  </body>
</html>
