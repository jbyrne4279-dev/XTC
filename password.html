<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XTC — Access Locked</title>
  <meta name="description" content="XTC Clothing — the next drop unlocks 1 November. Join the early access list for first access." />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="icon" type="image/png" href="/images/googlefaviconxtc.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      height: 100%;
      min-height: 100dvh;
      background: #000000;
      overscroll-behavior: none;
    }
    body {
      height: 100%;
      min-height: 100dvh;
      color: #646464;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    .gate {
      position: relative;
      z-index: 2;
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(64px + env(safe-area-inset-top)) 24px calc(64px + env(safe-area-inset-bottom));
      gap: 4px;
    }
    /* Stop the fade while the user is filling in the phone field */
    .gate--typing { animation: none; opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .gate { animation: none; }
    }

    /* After sign-up: hide everything except the success state, centered. */
    .gate--success {
      animation: none;
      padding: 24px;
    }
    .gate--success .gate__emblem,
    .gate--success .ea {
      display: none;
    }

    /* 4s after success: fade the success state back out (email form stays
       gone — they've already joined). */
    .gate--joined .ea {
      display: none;
    }

    .gate__emblem {
      width: 38px;
      height: auto;
      flex-shrink: 0;
      opacity: 1;
      filter: brightness(0) invert(0.4) drop-shadow(0 1px 4px rgba(0,0,0,0.4));
    }

    /* Early access form — dark field against the solid black backdrop */
    .ea { width: 100%; max-width: 460px; margin-top: 36px; }
    .ea__row {
      display: flex;
      gap: 6px;
    }
    .ea__field {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: stretch;
      background: rgba(100,100,100,0.06);
      border: 1px solid rgba(100,100,100,0.2);
      transition: border-color 0.2s, background 0.2s;
    }
    .ea__icon-box {
      width: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(100,100,100,0.2);
    }
    .ea__field:focus-within { border-color: rgba(100,100,100,0.7); background: rgba(100,100,100,0.1); }
    .ea__input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: #646464;
      font-family: inherit;
      font-size: 16px;   /* >=16px stops iOS Safari from zooming in on focus */
      letter-spacing: 0.5px;
      padding: 11px 12px;
      outline: none;
    }
    .ea__input::placeholder { color: rgba(100,100,100,0.4); }
    .ea__btn {
      flex: 0 0 auto;
      background: #646464;
      color: #f2f2f2;
      border: 1px solid #646464;
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 24px;
      cursor: pointer;
      transition: opacity 0.2s, background 0.25s, border-color 0.25s, color 0.25s;
      white-space: nowrap;
    }
    .ea__btn:hover { opacity: 0.8; }
    .ea__err {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: rgba(255,90,90,0.95);
      min-height: 14px;
    }

    /* Password unlock — quiet secondary form beneath the early-access one */
    .ea--unlock { margin-top: 14px; }
    .ea--unlock .ea__field--unlock { padding: 0; }
    .ea--unlock .ea__err { margin-top: 8px; }

    /* Success state */
    .ea-done {
      display: none;
      width: 100%;
      max-width: 400px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .ea-done--show { opacity: 1; transform: scale(1); }
    .ea-done__tick {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(100,100,100,0.4);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .ea-done__title { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #646464; }
    .ea-done__body { font-size: 11px; letter-spacing: 1px; color: rgba(100,100,100,0.6); text-align: center; }

    /* Buttons flash green (valid) or red (invalid) as the user types, then
       settle back to black. */
    .flash-green .ea__btn { background: #16a34a; border-color: #16a34a; color: #fff; }
    .flash-red .ea__btn { background: #dc2626; border-color: #dc2626; color: #fff; }

    @media (max-width: 480px) {
      .gate { padding: 48px 20px 48px; gap: 2px; }
      .ea { margin-top: 24px; }
    }
  </style>
</head>
<body>
  <main class="gate">
    <form class="ea" id="eaForm" novalidate>
      <div class="ea__row">
        <div class="ea__field">
          <div class="ea__icon-box"><img class="gate__emblem" src="images/skull-emblem-icon.webp?v=1787779103" alt="XTC skull emblem" /></div>
          <input class="ea__input" type="tel" id="eaPhone" placeholder="07762 326 426" autocomplete="tel" inputmode="tel" aria-label="Phone number" />
        </div>
        <button class="ea__btn" type="submit">Join</button>
      </div>
      <p class="ea__err" id="eaErr"></p>
    </form>

    <div class="ea-done" id="eaDone" aria-live="polite">
      <div class="ea-done__tick">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#646464" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="ea-done__title">You're In</p>
      <p class="ea-done__body">Watch your phone — early access is yours.</p>
    </div>


  </main>

  <script src="js/omnisend-config.js"></script>
  <script>

  // ── Password unlock ────────────────────────────────────────────────────────
  (function () {
    if (/[?&]error=1\b/.test(window.location.search)) {
      var unlockErr = document.getElementById('unlockErr');
      if (unlockErr) unlockErr.textContent = 'Wrong password. Try again.';
    }
  })();

  // ── Early access form → Omnisend (via the server proxy) ──────────────────────
  (function () {
    if (typeof initPhoneCountrySelectors === 'function') initPhoneCountrySelectors();

    var gate = document.querySelector('.gate');
    var form = document.getElementById('eaForm');
    var input = document.getElementById('eaPhone');
    var err = document.getElementById('eaErr');
    var done = document.getElementById('eaDone');

    // Stop the page fade while the phone field is focused.
    input.addEventListener('focus', function () { gate.classList.add('gate--typing'); });
    input.addEventListener('blur', function () { gate.classList.remove('gate--typing'); });

    // Buttons turn green as soon as a number is entered.
    // Flash the buttons green (valid) or red (invalid) a moment after the
    // user stops typing, then settle back to black.
    var flashTimer, clearTimer;
    input.addEventListener('input', function () {
      clearTimeout(flashTimer);
      clearTimeout(clearTimer);
      gate.classList.remove('flash-green', 'flash-red');

      var digits = input.value.replace(/\D/g, '');
      if (!digits.length) return; // empty — stay black, no flash

      flashTimer = setTimeout(function () {
        var valid = digits.length >= 7 && digits.length <= 15;
        gate.classList.add(valid ? 'flash-green' : 'flash-red');
        clearTimer = setTimeout(function () {
          gate.classList.remove('flash-green', 'flash-red');
        }, 700);
      }, 350);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      var raw = (input.value || '').trim();
      var digits = raw.replace(/\D/g, '');
      // No format requirement — just a sanity check that it's a plausible phone
      // number. Real numbers are 7–15 digits (E.164); this rejects obviously-fake
      // input, though only an SMS verification could prove the line is active.
      if (digits.length < 7 || digits.length > 15) {
        err.textContent = 'Please enter a valid phone number.';
        return;
      }
      // Send as typed; the server normalises to E.164 (UK-first for a leading 0).
      fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: raw, source: 'launch-early-access' })
      }).catch(function () {});
      if (window.omnisend) { try { omnisend.push(['identifyContact', { phone: raw }]); } catch (e2) {} }

      // Strip the page down to just the success state, centered.
      gate.classList.add('gate--success');
      done.style.display = 'flex';
      done.offsetHeight; // force reflow so the fade/scale-in actually transitions
      done.classList.add('ea-done--show');

      // After 4s, fade the success state back out (the email form stays
      // hidden — they've already joined).
      setTimeout(function () {
        done.classList.remove('ea-done--show');
        gate.classList.remove('gate--success');
        gate.classList.add('gate--joined');
        setTimeout(function () { done.style.display = 'none'; }, 500);
      }, 4000);
    });
  })();

  </script>

        t.parentNode.insertBefore(e,t)}();
</script>
  </body>
</html>
